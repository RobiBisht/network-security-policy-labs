Lab 3: Host firewall with default deny (policy 4.5)

Policy requirement
Deny all inbound traffic by default. The web server accepts HTTP/HTTPS from anyone and SSH only from the admin VLAN.

Option A: UFW (simple front-end for the Linux firewall)

sudo ufw default deny incoming
sudo ufw default allow outgoing
sudo ufw limit from 192.168.10.0/24 to any port 22 proto tcp # SSH with rate limiting
sudo ufw allow 80/tcp
sudo ufw allow 443/tcp
sudo ufw logging medium
sudo ufw enable
sudo ufw status verbose
sudo ufw status numbered

Option B: nftables (modern, replaces iptables)

Use either UFW or nftables, not both at the same time. Save this as /etc/nftables.conf:
#!/usr/sbin/nft -f

flush ruleset
table inet filter {
	chain input {
		type filter hook input priority 0; policy drop;
		
		iif "lo" accept
 		ct state established,related accept
 		ct state invalid drop
 
		meta l4proto ipv6-icmp accept
 		ip protocol icmp icmp type echo-request limit rate 5/second accept
 
		ip saddr 192.168.10.0/24 tcp dport 22 accept
 		tcp dport { 80, 443 } accept
 	
		log prefix "NFT-DROP: " limit rate 5/minute
 	}
 	chain forward { type filter hook forward priority 0; policy drop; }
 	chain output { type filter hook output priority 0; policy accept; }
}

sudo nft -c -f /etc/nftables.conf # check syntax only
sudo nft -f /etc/nftables.conf # load
sudo systemctl enable --now nftables # start now and at boot
sudo nft list ruleset

Step: test that the policy really works

# from the student VLAN machine (should show 22 filtered, 80 and 443 open)
nmap -Pn -p 22,80,443 192.168.30.10

# from the admin VLAN machine (22 should now be open)
nmap -Pn -p 22,80,443 192.168.30.10

Teaching point

Testing from the outside proves the control works. A policy that was never tested is only an assumption.