#Lab 1: Password and account lockout policy on Linux (Ubuntu)

#Policy requirement (4.2)
#Passwords must be at least 12 characters with mixed character types, change every 90 days; accounts lock for 15 minutes after 5 failed attempts.

#Step 1: install the password quality module

sudo apt update
sudo apt install -y libpam-pwquality

#Step 2: set complexity rules in /etc/security/pwquality.conf

sudo nano /etc/security/pwquality.conf

# add or edit these lines
minlen = 12
dcredit = -1 # at least 1 digit
ucredit = -1 # at least 1 upper case letter
lcredit = -1 # at least 1 lower case letter
ocredit = -1 # at least 1 symbol
maxrepeat = 3 # no more than 3 identical characters in a row
usercheck = 1 # password must not contain the user name
retry = 3

#A negative value means "at least this many" characters of that type are required.

#Step 3: set ageing rules in /etc/login.defs (applies to NEW users)

sudo nano /etc/login.defs

PASS_MAX_DAYS 90
PASS_MIN_DAYS 1
PASS_WARN_AGE 7

#Step 4: apply to an existing user and verify

sudo chage -M 90 -m 1 -W 7 student1
sudo chage -l student1

# test password strength quickly
echo "abc123" | pwscore
echo "Tr4in!Stat1on-Blue" | pwscore

#The first password fails the policy (pwscore prints an error); the second returns a score. Try changing a real password with passwd and watch the policy reject weak ones.

#Step 5: account lockout after failed logins (pam_faillock)

sudo nano /etc/security/faillock.conf

deny = 5
fail_interval = 900
unlock_time = 900

#Then wire the module into the PAM authentication stack. Back up the file first and keep a root session open while testing.

sudo cp /etc/pam.d/common-auth /etc/pam.d/common-auth.bak
sudo nano /etc/pam.d/common-auth

# replace the existing pam_unix line with this block
auth required pam_faillock.so preauth
auth [success=1 default=ignore] pam_unix.so nullok
auth [default=die] pam_faillock.so authfail
auth sufficient pam_faillock.so authsucc

# also add this line in /etc/pam.d/common-account
account required pam_faillock.so

# Test: fail the login 5 times for user student1, then check
sudo faillock --user student1
# Unlock manually when needed
sudo faillock --user student1 --reset

#Teaching point

#Lockout stops online password guessing, but it can also be abused to lock out legitimate users (a denial of service). That is why the policy uses a temporary 15-minute lock and not a permanent one.